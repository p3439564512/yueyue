name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip chatapp-android-source.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - run: cd chatapp-android-source && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
name: chatapp-android-source/app/build/outputs/apk/debug/app-debug.apk
